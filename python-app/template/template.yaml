apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-app
  title: Python flask template
  description: Provision a minimalst python app
spec:
  owner: development
  type: service

  parameters:
    - title: Fill in some steps
      required:
        - component_id
        - environment
      properties:
        component_id:
          title: Component name
          type: string
          description: Unique name of the component
          ui:autofocus: true
          ui:options:
            rows: 5
        environment:
          title: Environment
          type: string
          description: The environment where the component will be deploy
          enum:
            - dev
            - prod
    
